name: Feature request
description: Suggest a focused improvement to Chiterm
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What should Chiterm do?
      description: Describe the behavior that would help.
    validations:
      required: true
