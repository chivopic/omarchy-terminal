<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Omarchy Terminal workspace illustration</title>
  <desc id="desc">A stylized terminal window with tabs and two side-by-side shell panes.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151e2c"/><stop offset="1" stop-color="#10121d"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ad8c5" stop-opacity=".20"/><stop offset="1" stop-color="#8ca9ff" stop-opacity=".04"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="window"><rect x="110" y="125" width="1060" height="480" rx="14"/></clipPath>
  </defs>
  <rect width="1280" height="720" fill="url(#back)"/>
  <circle cx="1070" cy="100" r="250" fill="url(#glow)"/>
  <circle cx="160" cy="660" r="220" fill="url(#glow)"/>
  <text x="110" y="68" fill="#e7efe9" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="1">OMARCHY TERMINAL</text>
  <text x="1170" y="68" fill="#9aabaf" font-family="sans-serif" font-size="14" text-anchor="end" letter-spacing="2">TABS · SPLITS · SHELL</text>
  <rect x="110" y="139" width="1060" height="480" rx="14" fill="#000" opacity=".48" filter="url(#shadow)"/>
  <g clip-path="url(#window)">
    <rect x="110" y="125" width="1060" height="480" fill="#111923"/>
    <rect x="110" y="125" width="1060" height="52" fill="#26313b"/>
    <rect x="128" y="137" width="30" height="28" rx="6" fill="#3b4952"/>
    <path d="M143 144v14m-7-7h14" stroke="#dce7e0" stroke-width="2" stroke-linecap="round"/>
    <text x="640" y="158" text-anchor="middle" fill="#e8f1ec" font-family="sans-serif" font-size="16" font-weight="600">Omarchy Terminal</text>
    <path d="M1100 145h17m-17 6h17m-17 6h17" stroke="#dce7e0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1141" cy="151" r="11" fill="#52606a"/><path d="M1137 147l8 8m0-8l-8 8" stroke="#e8efeb" stroke-width="1.5"/>
    <rect x="110" y="177" width="1060" height="42" fill="#202a34"/>
    <rect x="126" y="182" width="165" height="36" rx="6" fill="#33423f"/>
    <text x="147" y="205" fill="#e4f1e9" font-family="sans-serif" font-size="14">●  project</text>
    <text x="317" y="205" fill="#91a29f" font-family="sans-serif" font-size="14">○  notes</text>
    <rect x="110" y="219" width="526" height="386" fill="#101921"/>
    <rect x="644" y="219" width="526" height="386" fill="#131e27"/>
    <rect x="636" y="219" width="8" height="386" fill="#344a49"/>
    <g font-family="monospace" font-size="18">
      <text x="145" y="268" fill="#84d6b0">❯ <tspan fill="#e3ece6">pwd</tspan></text>
      <text x="145" y="300" fill="#a9bcb6">/home/user/Projects/omarchy-terminal</text>
      <text x="145" y="349" fill="#84d6b0">❯ <tspan fill="#e3ece6">ls</tspan></text>
      <text x="145" y="381" fill="#9cb9ec">README.md  <tspan fill="#a9bcb6">omarchy_terminal.py</tspan></text>
      <text x="145" y="430" fill="#84d6b0">❯</text>
      <text x="678" y="268" fill="#88b9f2">❯ <tspan fill="#e3ece6">git status</tspan></text>
      <text x="678" y="300" fill="#a9bcb6">On branch main</text>
      <text x="678" y="332" fill="#a9bcb6">working tree clean</text>
      <text x="678" y="381" fill="#88b9f2">❯</text><rect x="701" y="364" width="10" height="21" rx="1" fill="#abcdf7"/>
    </g>
  </g>
  <rect x="110.5" y="125.5" width="1059" height="479" rx="14" fill="none" stroke="#52635f"/>
  <text x="110" y="665" fill="#9daead" font-family="sans-serif" font-size="15">Native GTK 4 + VTE</text>
  <text x="1170" y="665" text-anchor="end" fill="#9daead" font-family="sans-serif" font-size="15">Workspace illustration · not a screenshot</text>
